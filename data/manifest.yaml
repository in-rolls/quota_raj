# Data this repository uses but does not own.
#
# Each entry pins a version and a sha256. `up_path()` and `ref_path()` in
# scripts/00_utils.R resolve these: they look in the local cache, fall back to a
# sibling clone, otherwise download -- and always verify the checksum before
# handing back a path. A mismatch is an error, never a silent substitution.
#
# The checksums were taken from the copies that were in data/up/ when this file
# was written, so a fetch that returns anything else proves the data moved.

cache_dir: ~/data

upstream:
  local_elections_up:
    repo: in-rolls/local_elections_up
    ref: v1.1
    raw: https://raw.githubusercontent.com/in-rolls/local_elections_up
    sibling: ../local_elections_up
    files:
      data/fin/up_gp_sarpanch_2005_fixed_with_transliteration.parquet: 2d5826be50563a7b978cabd451f6fb0505909339b59429dbe6144b9e129f24d6
